server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip the usual text-ish assets — cheap win, CRA's build output is
    # mostly JS/CSS/HTML.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed filenames (CRA's build output) are safe to cache hard;
    # index.html is not, since it's what points at today's hashed bundle.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router (client-side routing): any path that isn't a real
    # static file falls back to index.html so deep links (e.g.
    # /live-feed on a hard refresh) don't 404 against nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
