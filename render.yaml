# Render Blueprint — https://render.com/docs/blueprint-spec
# ==============================================================
# Deploys the backend and ML service as Docker-based web services, plus
# a managed Postgres database, from this one file: Render dashboard ->
# New -> Blueprint -> point at this repo.
#
# NOT independently verified against a live Render deploy (this repo was
# prepared without Render account access) — the shape follows Render's
# documented Blueprint spec, but double-check field names against
# https://render.com/docs/blueprint-spec if Render's schema has moved on
# since this was written. A few values are intentionally left as
# `sync: false` (Render will prompt for them in the dashboard) rather
# than guessed at, since they're deployment-specific:
#   - CORS_ALLOWED_ORIGINS: your deployed frontend's exact origin
#     (e.g. https://fraudguard.vercel.app) — set AFTER the frontend is
#     deployed and you know its real URL.
#   - ML_SERVICE_URL: Render's inter-service networking config has
#     changed over time; easiest is to deploy fraudguard-ml-service
#     first, copy its public URL from the dashboard, and paste it here.
#   - ADMIN_PASSWORD: pick a real one — don't ship admin123 anywhere
#     public (see README's Security section).
#   - SMTP_HOST / SMTP_USER / SMTP_PASS: a real SMTP provider (e.g.
#     SendGrid, Postmark, SES) for password-reset and verification
#     emails to actually be delivered — see services/emailService.js.
#     Without these, config/env.js refuses to boot in production rather
#     than silently only logging emails to the console.
#   - FRONTEND_URL: your deployed frontend's exact origin — the emailed
#     verification/reset links point here.

databases:
  - name: fraudguard-db
    plan: free
    databaseName: fraudguard
    user: fraudguard

services:
  - type: web
    name: fraudguard-ml-service
    runtime: docker
    dockerfilePath: ./ml_service/Dockerfile
    dockerContext: ./ml_service
    plan: free
    healthCheckPath: /health
    envVars: []

  - type: web
    name: fraudguard-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render generates a random 32+ char value
      - key: DATABASE_URL
        fromDatabase:
          name: fraudguard-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false # set to your deployed frontend's origin — see note above
      - key: ML_SERVICE_URL
        sync: false # set to fraudguard-ml-service's public URL — see note above
      - key: ADMIN_PASSWORD
        sync: false # pick a real password, don't leave this unset in production
      - key: FRONTEND_URL
        sync: false # your deployed frontend's origin — used to build emailed links
      - key: SMTP_HOST
        sync: false # required in production — see note above
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SEED_ON_BOOT
        value: "true"
      - key: SEED_ON_BOOT_USERS
        value: "15"
      - key: SEED_ON_BOOT_DAYS
        value: "60"
